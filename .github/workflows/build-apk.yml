name: Build Finals Bakery app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build the app
        run: gradle -p android assembleRelease --no-daemon

      - name: Put the app on the Releases page
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk FinalsBakery.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest FinalsBakery.apk --title "Finals Bakery (latest)" --notes "Download FinalsBakery.apk on your phone and open it to install."
